[package]
name = "elegance"
version = "0.1.0"
edition = "2024"
description = "Fast source-code metrics for clarity, simplicity and elegance"
license = "MIT"

[dependencies]
ignore = "0.4.31"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-cuda = "0.21.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-ocaml = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
yaml-rust2 = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
