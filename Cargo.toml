[package]
name = "elegance-rs"
version = "0.2.0"
edition = "2024"
description = "Fast source-code metrics for clarity, simplicity and elegance"
license = "MIT"
repository = "https://github.com/GrigoryEvko/elegance"
readme = "README.md"
keywords = ["metrics", "static-analysis", "code-quality", "linter", "cli"]
categories = ["development-tools", "command-line-utilities"]

# The package is `elegance-rs` because `elegance` is taken by an
# unrelated pretty-printing library. The COMMAND stays `elegance`.
[[bin]]
name = "elegance"
path = "src/main.rs"

[dependencies]
ignore = "0.4.31"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
# The runtime and the C++ grammar come from the forks of GrigoryEvko, each
# pinned to a commit. The runtime is tree-sitter 0.27.0 with the patches of
# the C++ fork (tag v0.27.0-cpp-fork.5). It reads the grammars of ABI 14 and
# ABI 15 below and the ABI of the C++ fork, so one runtime serves every
# grammar. The `[patch.crates-io]` table at the end holds the same commit.
#
# THE TWO PINS MOVE TOGETHER. The C++ grammar below has ABI 1019, and the
# tag v0.27.0-cpp-fork.4 read a maximum of ABI 1018. A runtime that does
# not read the ABI of the grammar panics at `set_language` in every rayon
# worker, so the pair is one decision and not two. ABI 1019 gives the
# external scanner the byte offset of its scan position.
#
# THE TAG MUST HOLD THE THREE ABI GATES, or the 19 upstream grammars below
# run with the limits of the C++ fork. The tag v0.27.0-cpp-fork.3 held two
# of the three and left the summary depth at 256 for every grammar, and
# TypeScript then cost 11,488 Ginstr over 2,392 files against 1,830 for
# the published runtime, 6.28 times. The tag v0.27.0-cpp-fork.4 holds the
# third gate, and the same run costs 1,806 Ginstr, 0.987 times. The tag
# v0.27.0-cpp-fork.5 keeps the three gates and adds the byte offset.
tree-sitter = { git = "https://github.com/GrigoryEvko/tree-sitter", rev = "d55ab7e6c1f1528f9c284f68f5c4222e07de069e" }
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
# THE SEED FORMAT IS PART OF THIS PIN. `src/lang/cppseed.rs` reads a seed
# file, and the scanner of this commit reads version 3 of that format. A
# seed that `cargo xtask seed collect` of another commit wrote can hold
# another version, and the reader then stops the run by name.
tree-sitter-cpp = { git = "https://github.com/GrigoryEvko/tree-sitter-cpp", rev = "18d0e9bbcd6da58e6cd10d72cbb6910c7a2a3db0" }
tree-sitter-cuda = "0.21.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
ts-parser-perl = "2.0.0"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-lua = "0.5.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-swift = "0.7.3"
tree-sitter-scala = "0.26.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-solidity = "1.2.13"
yaml-rust2 = "0.11.0"

num_cpus = "1.17"

# jemalloc everywhere it exists. MSVC is the exception and the release
# matrix ships two Windows binaries, so the dependency is target-gated
# rather than the code being.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[profile.release]
opt-level = 3
# Fat LTO across every crate, and one codegen unit so the optimizer sees
# the whole program: the hot path is a tree walk calling through the
# per-language `Pack` function pointers, which only inlines when the
# caller and the callee are compiled together.
lto = "fat"
codegen-units = 1
# No `catch_unwind` anywhere in the tree, and a panic in a rayon worker
# already ends the run, so unwinding buys nothing and costs a landing
# pad at every call that can panic.
panic = "abort"
# Size, not speed. A release build carries no debug info to begin with,
# so this is worth 0.4 MB of 55.4; `strip = "symbols"` takes 2.3 MB but
# costs the function names in a panic backtrace, which is the wrong
# trade for a parser that meets code nobody here has seen. Almost all of
# the binary is the twenty-two vendored grammars.
strip = "debuginfo"

# Each crate that asks crates.io for tree-sitter gets the fork runtime, so the
# build links one runtime. Keep the commit equal to the dependency above.
#
# The runtime takes tree-sitter-language from the workspace of its own
# repository, and each grammar crate takes it from crates.io. The two copies
# declare the same `links` value, and cargo refuses a graph that holds two.
# So tree-sitter-language comes from the same commit. At that commit it is
# byte for byte the crates.io release 0.1.8, which that commit published.
[patch.crates-io]
tree-sitter = { git = "https://github.com/GrigoryEvko/tree-sitter", rev = "d55ab7e6c1f1528f9c284f68f5c4222e07de069e" }
tree-sitter-language = { git = "https://github.com/GrigoryEvko/tree-sitter", rev = "d55ab7e6c1f1528f9c284f68f5c4222e07de069e" }
