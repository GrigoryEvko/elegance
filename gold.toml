sha = "8aa942972859644a7e3f74ba288fa5c660b68637"
# third-party/: mimalloc, xxhash, zlib and blake3 vendored whole. Not
# mold's style, and blake3 would put hand-written assembly in a C++
# budget.
#
# test/: 518 SHELL files and no C++ at all — mold tests a linker by
# running it, so every case is the same 20-line harness sourcing
# common.inc with one assertion changed. They parse to zero units, and
# keeping them would hand one C++ repo 60% of the SHELL corpus. That is
# grpc-go's rejection and date-fns's rejection at once, arriving through
# a language section nobody was editing.
prune = "third-party test"


# --- cu: kernels, and the corpus that could only be added once
# calibration respected declarations.
#
# The sample counts were never the obstacle: these five give 9,000+ CUDA
# units against a floor of 200, and the derived numbers are genuinely
# unlike C++ — params p99 14 against 5, magic numbers 30 against 10,
# length 208 against 117. A kernel really does take fourteen arguments
# and really is full of tile sizes, so CUDA earns its own section.
#
# What blocked it was that a modern CUDA repository is a Python and C++
# monorepo with kernels inside. cutlass alone brings 1,115 .cpp files
# and 596 .py; transformer-engine brings 421 .py. Pooled by extension,
# adding these five moved 46 budgets in OTHER languages — py length
# 80 -> 252 and cognitive 22 -> 45, cpp params 5 -> 115 and confusable
# 2 -> 112. Pruning could not fix it, because the .cpp files pushing cpp
# params to 115 ARE cutlass, and cutting a repo's own C++ to protect
# another section's number would be dishonest twice over. Scoping fixes
# it at the root: a repo speaks only for the language it was fetched
# for, so cutlass's build tooling stays out of Python's percentiles.
#
# cccl was measured and rejected on its own terms: 612 of its 2,021
# CUDA files (30%) are unreadable, libcu++'s concept-heavy macros
# defeating the grammar the way mp-units did.
#
# cutlass is 5,072 of the section's units and it TIGHTENS rather than
# dictates — dropping it moves cognitive p99 from 55 to 79 and length
# from 258 to 300, because the others are the branchy ones. That is the
# opposite of the esbuild failure this file rejects repos for, so its
# size is earning a stricter bar rather than an inflated one.
[[repo]]
lang = "cuda"
name = "cutlass"
url = "https://github.com/NVIDIA/cutlass"
sha = "f94ec46f4f63f96003d6cfdf2014731e7672c281"
# docs/: Doxygen's generated search index, 159 .js files plus a
# vendored jquery, none of it anybody's style.
#
# include/cute/arch/: 32 files transcribing the tensor-core ISA, one
# overload per instruction, each taking one argument per register —
# 2,459 units and 195k lines of mechanically-shaped code. They were
# dictating two of this section's budgets by themselves: params p99 67
# against 15 without them, confusable 64 against 8, while cognitive
# (55) and length (242 against 247) did not move at all. A params
# budget of 67 is a budget that never fires. That is date-fns's
# rejection exactly — calibrating on a template measures the template —
# narrowed to the two metrics it actually captured.
prune = "docs include/cute/arch"

