# --- shell: the language that provisions production, and the thinnest
# section here. Three repos, deliberately.
#
# Shell is the one language here that lives INSIDE other people's
# projects, and the corpus reflects that: these three repos contribute
# 135 files, while the build and CI scripts sitting in the other 37
# checkouts contribute 207 (vscode 68, dune 53, curl 29, redis 21,
# ghostty 10). That is the JavaScript trap gold.toml warns about above,
# and it is accepted HERE for a reason it was not accepted there: those
# files are real reviewed shell from admired projects, not fixtures, and
# shell genuinely appears in the world as a supporting script more often
# than as a library. It is not free — the three chosen repos alone read
# cognitive p99 34, and the pooled corpus reads 44, because platform
# detection and feature probing really do branch harder than a library
# does. A reader of shell's budgets should know they describe both.
#
# Three were measured and DROPPED, each for a stated reason:
#   nvm (5 files, 6.1k lines) -- one 4000-line nvm.sh monolith. Adding it
#     moved cognitive p99 from 34 to 42, a 24% loosening driven by a
#     script nobody holds up as a model. Widely used is not admired.
#   ohmyzsh (17 files, 7.6k lines) -- a zsh framework read by a bash
#     grammar, and a community plugin collection of mixed authorship.
#     Wrong dialect and uneven provenance at once.
#   rbenv (3 files, 148 lines) -- contributes nothing measurable. Its
#     real logic lives in extensionless libexec/rbenv-* scripts, which
#     `Lang::from_path` does not see (documented in the shell pack).
#
# git carries `prune`, and it is the whole reason that field exists:
# 94% of git's shell is the t/ test suite (326k of 346k lines), whose
# bodies sit inside single-quoted `test_expect_success` strings the
# parser cannot enter. Keeping t/ would calibrate shell on 326k lines
# of code the tool cannot read, and drown the other repos 13:1.
[[repo]]
lang = "shell"
name = "git"
url = "https://github.com/git/git"
sha = "a97fcc37c2bc6340a8d7ce78dedf227aac4e9aa7"
prune = "t"

