# The gold corpus: codebases widely considered exemplary, pinned by SHA.
# Calibration (budgets = gold percentiles per language) must be
# reproducible: an unpinned corpus is an opinion, a pinned one is data.
#
# Fetch with: ./gold-fetch.sh [target-dir]   (default /tmp/gold)
#
# FOUR OR MORE PER LANGUAGE, deliberately. The first version of this file
# had one Go repo and no JavaScript or TSX repo at all, and both mistakes
# produced budgets that described a project rather than a language: with
# no JS repo, JavaScript's numbers came from whatever .js files happened
# to sit inside the TypeScript and Go checkouts -- build scripts, test
# fixtures, colorizer inputs -- which is how it acquired a magic-numbers
# budget of 14.
#
# EVERY REPO SPEAKS ONLY FOR ITS DECLARED LANGUAGE. Adding repos was the
# right response to that mistake and only half a fix, because the
# incidental files stayed in the pool: JavaScript still read magic
# numbers 7 with its own four repos present, and 2 once the borrowed
# files were scoped out. Calibration now honours the `lang` field above,
# and the rule is enforced rather than aspirational -- tsx was the case
# that proved it, having met the four-repo rule on paper while borrowing
# more than half its evidence from the ts checkouts. Shell is the single
# declared exception and says why in its own section.
#
# Two entries were dropped AFTER measuring them, not before, and neither
# for scoring badly. Both are fine software; both are unrepresentative
# samples:
#
#   esbuild (go) -- deliberately unidiomatic style. visitExprInOut is
#     2423 lines with 89 case arms and 379 ifs, verified by hand. It
#     alone set Go's cognitive budget to 163 against Rust's 19. The four
#     repos kept here read 32.
#   date-fns (ts) -- 52.6% duplicated, which is 69 near-identical locale
#     match/index.ts files. That is one template instantiated per
#     language, so calibrating on it measures the template.
#
# vscode was checked for the same distortion and KEPT: TypeScript reads
# p99 38 with it and 40 without, so it carries the at-scale evidence
# without dictating the number.
#
# Known and accepted: Go's length p99 is inflated by table-driven tests
# (go-cmp's TestOptions is 1099 lines), which is idiomatic Go rather than
# a long function in the bad sense.
#
# NOT GROWN FOR interface width, and the measurement is the reason.
# Go and Rust budget it from the compiled default because the corpus
# holds 29 interfaces and 66 traits -- far under the 200-sample floor a
# percentile needs -- and the obvious fix makes things worse. Measured
# densities: TypeScript declares an interface every 12 units (8.26%),
# Go one every 68 (1.47%), Rust one every 161 (0.62%). Clearing the
# floor therefore needs about 13,600 units of Go or 32,400 of Rust,
# against the 1,974 and 10,680 that are here.
#
# Candidates were fetched and measured rather than argued about:
#   grpc-go     -- 180 interfaces, which WOULD clear the floor, and
#                  9,443 units, five times the entire existing Go
#                  corpus. One repo at 84% of a language stops being a
#                  sample and becomes the definition; rejected for the
#                  same reason esbuild was.
#   afero       -- 17 interfaces, go-plugin 16, tower 24 traits. Each
#                  is small, admired and interface-dense, and all three
#                  together still leave both languages under the floor
#                  while moving every OTHER budget in those languages.
#                  Cost without a categorical gain; rejected.
#
# So the default stands, and `--diff`-style honesty covers it: a
# defaulted budget now prints with a trailing dot and reports
# budget_source "default", so a reader can see which numbers rest on
# the corpus and which rest on this file. The scarcity is itself the
# finding -- Go's median interface declares ONE method, which is the
# small-interface culture the proverb describes, measured.

